[package]
name = "diskvis"
version = "0.2.0"
edition = "2021"
description = "A premium interactive terminal disk usage visualizer"
license = "MIT"
repository = "https://github.com/theoriuhd/diskvis"
homepage = "https://github.com/theoriuhd/diskvis"
keywords = ["disk", "usage", "tui", "cli", "filesystem"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
colored = "2.1"
ratatui = "0.29"
crossterm = "0.28"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
human-panic = "2"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
