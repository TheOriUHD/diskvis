[package]
name = "diskvis"
version = "1.5.0"
edition = "2021"
description = "A premium interactive terminal disk usage visualizer"
license = "MIT"
repository = "https://github.com/theoriuhd/diskvis"
homepage = "https://github.com/theoriuhd/diskvis"
keywords = ["disk", "usage", "tui", "cli", "filesystem"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
colored = "2.1"
ratatui = "0.29"
crossterm = "0.28"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
human-panic = "2"
toml = "0.8"
arboard = "3"
dirs = "5"
rayon = "1"
users = "0.11"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[package.metadata.deb]
maintainer = "TheOriUHD <theoriuhd@users.noreply.github.com>"
copyright = "2026, TheOriUHD"
license-file = ["LICENSE", "0"]
extended-description = "An interactive terminal disk usage visualizer with a TUI."
section = "utils"
priority = "optional"
assets = [
    ["target/release/diskvis", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/diskvis/README", "644"],
]

[profile.release]
lto = true
codegen-units = 1
